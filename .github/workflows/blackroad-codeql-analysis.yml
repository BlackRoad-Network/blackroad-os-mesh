name: 🔍 BlackRoad CodeQL Security Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run at 4 AM UTC every Monday (10 PM CST Sunday)
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # JavaScript also covers the tracked TypeScript source. No Python source is tracked.
        language: [ 'javascript' ]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Auto-build for compiled languages
          # For interpreted languages (JS, Python, Ruby), this is not needed
          queries: +security-and-quality

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v3
        # Only needed for compiled languages like Java, C++, C#, Go, Swift
        # For JavaScript and Python, CodeQL analyzes without building

      - name: 🔒 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

      - name: 📊 Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: |
            **/results/*.sarif
            **/results/*.csv
          retention-days: 30

      - name: Report Analysis Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await core.summary
              .addHeading('CodeQL analysis failed')
              .addRaw('Review this run for analysis errors or security findings.')
              .addLink('Workflow run', `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`)
              .write();
