name: 🤖 BlackRoad Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["Security", "Node.js Build and Deploy", "🌌 Master BlackRoad Workflow", "Trinity Compliance Check"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: blackroad-bot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-Merge Compliant PRs
    runs-on: ubuntu-latest
    # Event actors do not establish PR authorship; the script re-reads the PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate current bot PR and merge exact head
        uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./scripts/auto-merge.cjs');
            await run({ github, context, core });
