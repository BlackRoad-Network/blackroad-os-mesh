name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: Mesh CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # This repository implements its service in TypeScript.
          languages: javascript
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: /mesh-security/javascript

  dependency-scan:
    name: Mesh dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

  secret-scan:
    name: Mesh secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan repository history with redacted output
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact=100 --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json"
      - name: Upload redacted findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 7
