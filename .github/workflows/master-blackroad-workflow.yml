# BlackRoad repository verification. External integration adapters are not implemented here.
name: 🌌 Master BlackRoad Workflow

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and test mesh and merge policy
        run: npm test
      - name: Check shared canon and Trinity scripts
        run: |
          node scripts/verify-repository.cjs
          mapfile -d '' scripts < <(find .trinity -type f -name '*.sh' -print0)
          test "${#scripts[@]}" -gt 0
          for script in "${scripts[@]}"; do bash -n "$script"; done

  summary:
    name: Verification receipt
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report measured results and unimplemented integrations
        uses: actions/github-script@v7
        env:
          VERIFICATION_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const result = process.env.VERIFICATION_RESULT;
            const receipt = {
              repository: context.repo.owner + '/' + context.repo.repo,
              sha: context.sha,
              event: context.eventName,
              run_id: context.runId,
              recorded_at: new Date().toISOString(),
              repository_verification: result,
              integrations: Object.fromEntries([
                'memory_coordination', 'codex_search', 'trinity_approval',
                'keycloak_authentication', 'linear_tasks', 'canva_diagrams',
                'slack_notifications', 'external_memory_logging'
              ].map(name => [name, 'not_implemented_in_workflow']))
            };
            await core.summary
              .addHeading('BlackRoad verification receipt')
              .addRaw('We access it all at RoadOS. We collaborate with Roadies. We code in Road.')
              .addCodeBlock(JSON.stringify(receipt, null, 2), 'json')
              .addRaw('Security findings are reported by the separate Security workflow. No external integration or deployment is certified by this receipt.')
              .write();
            if (result !== 'success') core.setFailed('Repository verification did not pass.');
